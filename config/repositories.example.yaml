# DeployPilot - Target Repositories Configuration Template
# Each target application must be explicitly defined and enabled here.
# Deployment root is strictly enforced: all paths must reside within ALLOWED_DEPLOYMENT_ROOT.

version: 1
repositories:
  - id: "token-calculator"
    name: "token-calculator"
    owner: "vajapravin"
    expected_remote: "https://github.com/vajapravin/token-calculator.git"
